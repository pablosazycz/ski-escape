name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app (Vite)
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.keystore -alias skiescape -keyalg RSA -keysize 2048 -validity 10000 -storepass skiescape123 -keypass skiescape123 -dname "CN=SkiEscape, OU=Games, O=SkiEscape, L=BA, S=BA, C=AR"

      - name: Build APKs with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug

      - name: Upload Release APK artifact (Para Tienda / Amazon)
        uses: actions/upload-artifact@v4
        with:
          name: ski-escape-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ski-escape-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
